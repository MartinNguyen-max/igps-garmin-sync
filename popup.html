<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        padding: 12px;
        margin: 0;
        background-color: #f8f9fa;
      }
      h3 {
        margin-top: 0;
        margin-bottom: 12px;
        color: #1a1a1a;
        font-size: 16px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 8px;
      }
      .ride-list {
        margin: 12px 0;
        max-height: 280px;
        overflow-y: auto;
      }
      .ride-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        transition: all 0.2s;
      }
      .ride-card:hover {
        border-color: #007acc;
        background-color: #f0f7ff;
      }
      .checkbox-container {
        margin-right: 10px;
        display: flex;
        align-items: center;
      }
      .ride-info {
        flex-grow: 1;
      }
      .ride-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .ride-date {
        font-weight: bold;
        font-size: 13px;
        color: #2d3748;
      }
      .ride-stats {
        display: flex;
        gap: 12px;
        font-size: 12px;
        color: #718096;
      }
      .stat-val {
        color: #1a202c;
        font-weight: 500;
      }
      button {
        width: 100%;
        background-color: #007acc;
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
      }
      button:hover {
        background-color: #005999;
      }
      button:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h3>Garmin Sync</h3>
    <div id="rides" class="ride-list">
      <p style="color: #666; font-size: 12px; text-align: center">
        Fetching your rides...
      </p>
    </div>
    <button id="sync-btn">Sync selected to Garmin</button>
    <script src="popup.js"></script>
  </body>
</html>
